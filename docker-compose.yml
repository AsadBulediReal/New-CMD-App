services:
  db:
    image: mongo:latest
    container_name: mongodb_cmd
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  server:
    build: ./server
    container_name: server_cmd
    restart: always
    depends_on:
      - db
    environment:
      - MONGODB_URI=mongodb://db:27017/cmd_app
      - PORT=5000
      - JWT_SECRET=${JWT_SECRET:-cmd-secure-secret-key-change-in-prod}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@usindh.edu.pk}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - EMAIL_FROM=${EMAIL_FROM:-}
    ports:
      - "5000:5000"

  frontend:
    build: ./frontend
    container_name: frontend_cmd
    restart: always
    depends_on:
      - server
    ports:
      - "80:80"

volumes:
  mongodb_data:
